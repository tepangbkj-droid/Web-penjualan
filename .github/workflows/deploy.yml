name: Deploy to GitHub Pages

# CATATAN: GitHub Pages hanya hosting statis — folder /api (Telegram) TIDAK berjalan di sini.
# Untuk fitur pesanan + kritik/saran → Telegram, deploy lewat Vercel (lihat README.md).
# Workflow ini tetap dipertahankan hanya sebagai build check. Token Telegram sudah
# DIHAPUS dari sini karena variabel VITE_* ikut ter-bundle ke JavaScript publik.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_WA_STORE_NUMBER: ${{ secrets.VITE_WA_STORE_NUMBER }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
